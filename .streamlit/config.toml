[theme]
base = "dark"
backgroundColor = "#03033e"
secondaryBackgroundColor = "#0f0f1a"
primaryColor = "#00d4ff"
textColor = "#e0e0e0"
font = "monospace"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
